{% extends "base.html" %}
{% block title %}Sign In — Norwick & Co.{% endblock %}
{% block content %}
<section class="wrap auth-layout">
  <div class="auth-card">
    <span class="logo-mark logo-mark-lg" aria-hidden="true">N</span>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to view your cart and order history.</p>
    {% if error %}<p class="notice notice-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>Email
        <input type="email" name="email" required placeholder="you@example.com" autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required placeholder="••••••••">
      </label>
      <button type="submit" class="btn btn-ink btn-wide">Sign in</button>
    </form>
    <p class="auth-switch">New to Norwick &amp; Co.? <a href="/register">Create an account</a></p>
  </div>
</section>
{% endblock %}
