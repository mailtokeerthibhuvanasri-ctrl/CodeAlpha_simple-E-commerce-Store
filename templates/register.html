{% extends "base.html" %}
{% block title %}Create Account — Norwick & Co.{% endblock %}
{% block content %}
<section class="wrap auth-layout">
  <div class="auth-card">
    <span class="logo-mark logo-mark-lg" aria-hidden="true">N</span>
    <h1>Create your account</h1>
    <p class="muted">Save your cart, track orders and check out faster.</p>
    {% if error %}<p class="notice notice-error">{{ error }}</p>{% endif %}
    <form method="post" action="/register">
      <label>Full name
        <input type="text" name="name" required placeholder="Jordan Avery" autofocus>
      </label>
      <label>Email
        <input type="email" name="email" required placeholder="you@example.com">
      </label>
      <label>Password
        <input type="password" name="password" required placeholder="At least 6 characters" minlength="6">
      </label>
      <button type="submit" class="btn btn-ink btn-wide">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
  </div>
</section>
{% endblock %}
